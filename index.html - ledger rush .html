document.addEventListener("keydown",e=>{
  if(!G||G.kind!=="flash"||!$("#fc")||$("#settings")) return;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();flipFlash()}
  else if(e.key==="ArrowRight"){e.preventDefault();markFlash(true)}
  else if(e.key==="ArrowLeft"){e.preventDefault();markFlash(false)}
});

/* ================= match ================= */
function startMatch(n){
  const r=R(CH); const pool=CH.terms.filter(t=>r.topics.includes(t.t)); if(pool.length<2) return;
  const pairs=shuffle(pool).slice(0,Math.min(n,pool.length));
  const tiles=shuffle(pairs.flatMap(t=>[{id:t.id,k:"t",text:t.term},{id:t.id,k:"d",text:t.def}]));
  G={kind:"match",n:pairs.length,pairs:pairs.map(p=>p.id),tiles,sel:null,matched:0,penalty:0,t0:performance.now(),busy:false};
  const best=r.matchBest[G.n];
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Match`);
  go(`<div class="quiz match">
    <div class="qtop"><button class="x" id="quit" aria-label="Exit match">${ICON.close}</button>
      <div class="track"><i id="mprog" style="width:0%"></i></div>
      <span class="qpill clock mclock">${CLOCK}<b id="mtime">0.0s</b></span></div>
    <div class="qmeta"><span class="qcount">Match each term to its definition</span>${best?`<span class="qpill">Best <b>${best.toFixed(1)}s</b></span>`:""}<span class="qpill pen" id="pen" hidden></span></div>
    <div class="mgrid">${tiles.map((x,i)=>`<button class="mtile ${x.k==="t"?"term":"def"}" data-i="${i}">${esc(x.text)}</button>`).join("")}</div>
  </div>`);
  $("#quit").onclick=()=>setup(CH);
  app.querySelectorAll(".mtile").forEach(b=>b.onclick=()=>pickTile(b));
  const tick=()=>{if(!G||G.kind!=="match"||G.done)return; const el=$("#mtime"); if(el) el.textContent=((performance.now()-G.t0)/1000+G.penalty).toFixed(1)+"s"; timerRAF=requestAnimationFrame(tick)};
  timerRAF=requestAnimationFrame(tick);
}
function pickTile(b){
  if(G.busy||b.classList.contains("gone")) return;
  const i=+b.dataset.i;
  if(G.sel===null){G.sel=i;b.classList.add("sel");return}
  if(G.sel===i){G.sel=null;b.classList.remove("sel");return}
  const a=G.tiles[G.sel], c=G.tiles[i], ab=app.querySelector(`.mtile[data-i="${G.sel}"]`);
  if(a.k===c.k){ab.classList.remove("sel");G.sel=i;b.classList.add("sel");return}
  G.busy=true;
  if(a.id===c.id){
    ab.classList.remove("sel"); ab.classList.add("ok"); b.classList.add("ok"); G.matched++;
    $("#mprog").style.width=G.matched/G.n*100+"%";
    setTimeout(()=>{ab.classList.add("gone");b.classList.add("gone");ab.disabled=true;b.disabled=true;G.busy=false;G.sel=null; if(G.matched===G.n) finishMatch()},reduce?60:320);
  } else {
    ab.classList.remove("sel"); ab.classList.add("bad"); b.classList.add("bad"); G.penalty+=1;
    const p=$("#pen"); p.hidden=false; p.textContent=`+${G.penalty}s penalty`;
    setTimeout(()=>{ab.classList.remove("bad");b.classList.remove("bad");G.busy=false;G.sel=null},reduce?250:550);
  }
}
function finishMatch(){
  G.done=true; stopTimer();
  const time=Math.round(((performance.now()-G.t0)/1000+G.penalty)*10)/10;
  const r=R(CH); const prev=r.matchBest[G.n]; const nb=!prev||time<prev; if(nb) r.matchBest[G.n]=time; save();
  const pairs=G.pairs.map(TBYID), n=G.n;
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Match`);
  go(`<div class="narrow" style="display:flex;flex-direction:column;gap:22px">
  <section class="panel panel-pad enter"><span class="eyebrow">${n} pairs matched</span>
    <p class="verdict mono" style="color:var(--accent);font-size:clamp(44px,9vw,72px)">${time.toFixed(1)}s</p>
    <p style="margin:6px 0 0;color:var(--muted)">${nb?(prev?`New best! Previous best was ${prev.toFixed(1)}s.`:"First time on the board. Beat it next round."):`Best time: ${prev.toFixed(1)}s`}${G.penalty?` · Includes ${G.penalty}s of penalties.`:""}</p></section>
  <section class="panel panel-pad enter"><h2>Pairs in this game</h2><div class="misses">${pairs.map(t=>`<div class="miss"><p class="ans" style="margin:0">${esc(t.term)}</p><p class="why">${esc(t.def)}</p></div>`).join("")}</div></section>
  <div class="row"><button class="btn primary big" id="again">Play again</button><button class="btn quiet" id="back">Change settings</button></div></div>`);
  $("#again").onclick=()=>startMatch(n); $("#back").onclick=()=>setup(CH);
}

/* ================= learn (Gizmo-style) ================= */
const LTYPES=[["multi","Multiple answers"],["single","One answer"],["mix","Mix"]];
function learnPool(ch,r){
  const type=r.lType||"mix"; const auth=ch.learn.filter(q=>r.topics.includes(q.t));
  if(type==="multi") return auth;
  return auth.concat(ch.terms.filter(x=>r.topics.includes(x.t)).map(x=>({id:"lt-"+x.id,t:x.t,termQ:x})));
}
const SINGLE_P={L1:"Which is an essential characteristic of a liability?",L7:"On a zero-interest-bearing note, which is true?",L14:"Which is an accrued liability?",L19:"Which is usually NOT accrued as a liability?",L24:"Which is a collection for a third party?",L26:"Which is NOT recorded as a liability?",L30:"Which is classified as a current liability?",L32:"Which is one of the requirements to accrue a loss contingency?",L37:"Which is neither recorded nor disclosed?"};
const singular=p=>p.replace(/^Which are examples of current liabilities\?/,"Which is an example of a current liability?")
  .replace(/^Which conditions must ALL exist/,"Which condition must exist").replace(/^Which rates are correct\?/,"Which rate is correct?")
  .replace(/^Which loss contingencies are/,"Which loss contingency is").replace(/^Which liabilities are/,"Which liability is")
  .replace(/^Which are /,"Which is ").replace(/^Which (describe|reduce|demonstrate)\b/,(m,v)=>"Which "+v+"s").replace(/ are correct\?$/," is correct?");
function buildLearn(item){
  const type=R(CH).lType||"mix";
  if(item.termQ){const x=item.termQ; const tw=(CH.termWrong&&CH.termWrong[x.term])||[];
    const d=(tw.length?tw.map(def=>({def})):shuffle(CH.terms.filter(o=>o.id!==x.id&&o.t===x.t))).slice(0,4);
    return {label:"Term",prompt:`What is ${/^[A-Z]{2,}/.test(x.term)?x.term:x.term.charAt(0).toLowerCase()+x.term.slice(1)}?`,opts:shuffle([{text:x.def,ok:true},...d.map(o=>({text:o.def,ok:false}))]),need:1,why:`${x.term}: ${x.def}`}}
  const multi=item.correct.length>=2&&(type==="multi"||(type==="mix"&&Math.random()<0.6));
  if(multi) return {label:"Concept",prompt:item.prompt,opts:shuffle([...item.correct.map(t=>({text:t,ok:true})),...shuffle(item.wrong).slice(0,Math.max(2,6-item.correct.length)).map(t=>({text:t,ok:false}))]),need:item.correct.length,why:item.why};
  const c=item.correct[Math.floor(Math.random()*item.correct.length)];
  return {label:"Concept",prompt:(SINGLE_P[item.id]||singular(item.prompt)),opts:shuffle([{text:c,ok:true},...shuffle(item.wrong).slice(0,4).map(t=>({text:t,ok:false}))]),need:1,why:item.why};
}
const LBYID=id=>id.startsWith("lt-")?{id,t:TBYID(id.slice(3)).t,termQ:TBYID(id.slice(3))}:CH.learn.find(q=>q.id===id);
function startLearn(n){
  const r=R(CH); const pool=learnPool(CH,r); if(!pool.length) return;
  const now=Date.now();
  const picked=pool.map(q=>{const x=r.learn[q.id]||{box:0,seen:0,last:0};const ageH=x.last?(now-x.last)/36e5:999;
    return {q,p:x.box*10-Math.min(ageH,48)/6+Math.random()*9-(x.seen?0:3)}}).sort((a,b)=>a.p-b.p).slice(0,n==="All"?pool.length:n).map(x=>x.q.id);
  G={kind:"learn",queue:shuffle(picked).map(id=>({id,retry:false})),i:0,total:picked.length,cleared:0,first:0,answered:0,missed:[],locked:false};
  renderLearn();
}
function renderLearn(){
  const item=G.queue[G.i]; const it=LBYID(item.id); const Q=buildLearn(it); G.cur={item,it,Q,picked:0,wrongPick:false};
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Learn`);
  const f=G.cleared/G.total, segs=6;
  go(`<div class="quiz learn">
    <div class="lprog">
      <span class="lc done" title="Cleared">${G.cleared}</span>
      <div class="segs">${Array.from({length:segs},(_,j)=>`<span class="lseg"><i style="width:${Math.max(0,Math.min(1,f*segs-j))*100}%"></i></span>`).join("")}</div>
      <span class="lc" title="Total">${G.total}</span>
      <button class="x" id="quit" aria-label="End session">${ICON.close}</button>
    </div>
    <section class="sheet qcard enter" id="card">
      <div class="card-head"><span class="eyebrow">${Q.label} · ${esc(topicName(it.t))}</span>${item.retry?'<span class="tag retry">Try again</span>':""}</div>
      <p class="prompt">${esc(Q.prompt)}</p>
      <p class="lneed" id="need">${Q.need>1?`Select all that apply <b>(${Q.need} left)</b>`:"Choose one answer"}</p>
      <div class="opts lopts">${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ln">${i+1}</span><span class="ot">${esc(o.text)}</span><span class="om"></span></button>`).join("")}</div>
      <div class="lfoot"><button class="dk" id="dk">Don't know?</button></div>
    </section>
    <div id="spacer"></div>
  </div><div id="fb"></div>`);
  $("#quit").onclick=()=>finishLearn(true);
  app.querySelectorAll(".lopts .opt").forEach(b=>b.onclick=()=>pickLearn(b));
  $("#dk").onclick=()=>{if(!G.locked) doneLearn(false,true)};
  G.locked=false;
}
function pickLearn(b){
  if(G.locked||b.disabled) return; const o=G.cur.Q.opts[+b.dataset.i]; b.disabled=true;
  if(o.ok){ b.classList.add("ok"); b.querySelector(".om").innerHTML=CHECK; G.cur.picked++;
    const left=G.cur.Q.need-G.cur.picked; const nd=$("#need");
    if(left>0){ if(nd) nd.innerHTML=`Select all that apply <b>(${left} left)</b>`; } else doneLearn(true);
  } else { b.classList.add("bad"); b.querySelector(".om").innerHTML=CROSS; doneLearn(false); }
}
function doneLearn(ok,dk){
  G.locked=true; const {item,it,Q}=G.cur; const r=R(CH); const x=r.learn[it.id]||(r.learn[it.id]={box:0,seen:0,last:0});
  x.seen++; x.last=Date.now();
  app.querySelectorAll(".lopts .opt").forEach((b,i)=>{const o=Q.opts[i]; b.disabled=true;
    if(o.ok&&!b.classList.contains("ok")){b.classList.add(ok?"ok":"missed"); b.querySelector(".om").innerHTML=CHECK}
    else if(!o.ok&&!b.classList.contains("bad")) b.classList.add("dim")});
  $("#dk").hidden=true;
  if(ok){ x.box=Math.min(MAXBOX,item.retry?Math.max(1,x.box):x.box+1); G.cleared++; if(!item.retry) G.first++; }
  else { x.box=0; if(!G.missed.includes(it.id)) G.missed.push(it.id); G.queue.splice(Math.min(G.queue.length,G.i+4),0,{id:item.id,retry:true}); }
  if(!item.retry) G.answered++; save();
  const fill=G.cleared/G.total; app.querySelectorAll(".segs .lseg i").forEach((el,j)=>el.style.width=Math.max(0,Math.min(1,fill*6-j))*100+"%");
  const done=$(".lc.done"); if(done) done.textContent=G.cleared;
  const last=G.i>=G.queue.length-1;
  const correct=Q.opts.filter(o=>o.ok).map(o=>o.text);
  const title=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:dk?"Here's the answer":"Not quite";
  const sub=ok?(item.retry?"Cleared on the retry.":`${G.cleared} of ${G.total} cleared`):"This one will come back in a few questions.";
  $("#fb").innerHTML=`<div class="fbsheet ${ok?"ok":"bad"}" role="status"><div class="fb-in">
    <div class="fb-head"><span class="fb-icon">${ok?CHECK:CROSS}</span><div class="fb-t"><strong>${title}</strong><span>${sub}</span></div></div>
    ${ok?"":`<div class="fb-ans"><span>Correct answer${correct.length>1?"s":""}</span>${correct.map(c=>`<b>${esc(c)}</b>`).join("")}</div>`}
    <p class="fb-why" id="why" ${ok?"hidden":""}>${esc(Q.why)}</p>
    <div class="fb-actions"><button class="btn fb-explain" id="explain">${ok?"Explain":"Hide explanation"}</button>
      <button class="btn big ${ok?"primary":"danger"}" id="next">${last?"Finish":"Continue"}</button></div></div></div>`;
  const fit=()=>{const sh=$(".fbsheet"),sp=$("#spacer"); if(sh&&sp) sp.style.height=sh.offsetHeight+16+"px"}; fit();
  $("#explain").onclick=()=>{const w=$("#why"),b=$("#explain"); w.hidden=!w.hidden; b.textContent=w.hidden?"Explain":"Hide explanation"; fit()};
  $("#next").focus({preventScroll:true});
  $("#next").onclick=()=>{G.i++; if(G.i>=G.queue.length) return finishLearn(false); renderLearn()};
}
function finishLearn(quit){
  const acc=G.answered?Math.round(G.first/G.answered*100):0;
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Learn`);
  go(`<div class="narrow" style="display:flex;flex-direction:column;gap:22px">
  <section class="panel panel-pad enter"><div class="result-top">${ring(acc/100,96)}<div><span class="eyebrow">${quit?"Session ended early":"Session complete"}</span>
    <p class="verdict" style="color:${acc>=70?"var(--accent)":"var(--red)"}">${acc>=90?"Locked in":acc>=70?"Getting there":"Keep practicing"}</p></div></div>
    <div class="statgrid"><div><b>${G.first}/${G.answered}</b><span>Right first try</span></div><div><b>${G.cleared}/${G.total}</b><span>Cleared</span></div><div><b>${G.missed.length}</b><span>Missed at least once</span></div></div></section>
  ${G.missed.length?`<section class="panel panel-pad enter"><h2>Review these</h2><div class="misses">${G.missed.map(id=>{const it=LBYID(id);
    return it.termQ?`<div class="miss"><p class="ans" style="margin:0">${esc(it.termQ.term)}</p><p class="why">${esc(it.termQ.def)}</p></div>`
    :`<div class="miss"><p>${esc(it.prompt)}</p>${it.correct.map(c=>`<p class="ans">${esc(c)}</p>`).join("")}<p class="why">${esc(it.why)}</p></div>`}).join("")}</div></section>`:""}
  <div class="row"><button class="btn primary big" id="again">Another session</button><button class="btn quiet" id="back">Change settings</button></div></div>`);
  const r=R(CH);

document.addEventListener("keydown",e=>{
  if(!G||G.kind!=="learn"||!$("#card")||$("#settings")) return;
  if(!G.locked&&/^[1-6]$/.test(e.key)){const b=app.querySelectorAll(".lopts .opt")[+e.key-1]; if(b){e.preventDefault();b.click()}}

/* ================= quick-fire ================= */
function pickCards(mode,n){
  const r=R(CH); let pool=CH.cards.filter(c=>r.topics.includes(c.t)); if(mode==="drill") pool=missPool();
  const now=Date.now();
  return shuffle(pool.map(c=>{const x=r.cards[c.id]||{box:0,seen:0,last:0};const ageH=x.last?(now-x.last)/36e5:999;
    let p=x.box*10-Math.min(ageH,48)/6+Math.random()*9; if(!x.seen)p-=3; return {c,p}}).sort((a,b)=>a.p-b.p).slice(0,n).map(x=>x.c)).map(c=>({id:c.id,retry:false}));

function startQuick(mode,n){

const mult=()=>Math.min(4,1+Math.floor(G.streak/3));
const BYID=id=>CH.cards.find(c=>c.id===id);
const HEART=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>`;
const FLAME=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 5.8 5 10.5A5 5 0 0 1 12 18a5 5 0 0 1-5-5.2c0-2 1-3.5 2.3-4.6.1 1.7.9 2.9 2 3.3C11 8.8 11.5 5.3 12 2z" fill="currentColor"/><path d="M12 22a4 4 0 0 1-4-4c0-1.6 1-2.7 2-3.4.2 1.2.9 2 2 2.2 0-1.5.6-2.6 1.6-3.6.9 1.3 2.4 2.6 2.4 4.8a4 4 0 0 1-4 4z" fill="currentColor" opacity=".55"/></svg>`;

function cardBody(c,opts){

const tlim=()=>S.settings.timer*1000;
function setupClock(){const on=!!S.settings.timer; const c=$("#clock"), t=$(".timer"); if(c) c.hidden=!on; if(t) t.style.visibility=on?"visible":"hidden";}
function runTimer(){stopTimer();setupClock();const b=$("#tbar");if(!b||!S.settings.timer||!G||G.locked)return;
  const secs=$("#secs"), clock=$("#clock");
  const tick=()=>{if(!G||G.locked||G.kind!=="quick")return; const left=Math.max(0,tlim()-(performance.now()-G.t0)); const f=left/tlim();
    b.style.width=f*100+"%"; if(secs) secs.textContent=Math.ceil(left/1000)+"s"; if(clock) clock.classList.toggle("low",left<=5000);
    if(left<=0){timeUp();return} timerRAF=requestAnimationFrame(tick)};
  timerRAF=requestAnimationFrame(tick)}
function timeUp(){const secs=$("#secs"), clock=$("#clock"); if(secs) secs.textContent="No bonus"; if(clock) clock.classList.add("low","over"); const b=$("#tbar"); if(b) b.style.width="0%";}
function stopTimer(){cancelAnimationFrame(timerRAF)}
const PRAISE=["Correct!","Nice work!","Nailed it!","Exactly right!","You got it!"];
function answerQuick(ok,correct,btn,timedOut){
  G.locked=true; stopTimer();
  const {item,c}=G.cur; const r=R(CH); const x=r.cards[c.id]||(r.cards[c.id]={box:0,seen:0,miss:0,last:0});
  const el=performance.now()-G.t0; x.seen++; x.last=Date.now(); let pts=0;
  if(ok){const b0=x.box; x.box=Math.min(MAXBOX,item.retry?Math.max(1,x.box):x.box+1); if(x.box>b0)G.promoted++;
    if(!item.retry){G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);pts=(100+(S.settings.timer?Math.round(50*Math.max(0,1-el/tlim())):0))*mult();G.score+=pts;G.correct++}}
  else{x.box=0;x.miss=(x.miss||0)+1;G.streak=0; if(!item.retry){G.flags--; if(!G.missed.includes(c.id))G.missed.push(c.id)} G.queue.splice(Math.min(G.queue.length,G.i+4),0,{id:c.id,retry:true})}
  if(!item.retry) G.answered++; save();
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(b.dataset.v===c.ans){b.classList.add("ok");b.querySelector(".om").innerHTML=CHECK}
    else if(b===btn){b.classList.add("bad");b.querySelector(".om").innerHTML=CROSS}
    else b.classList.add("dim")});
  const bl=$("#blank"); if(bl){bl.textContent=c.ans;bl.classList.add("ok")}
  app.querySelectorAll(".hid").forEach(h=>{h.textContent=h.dataset.v;h.classList.add("shown")});
  const inp=$("#numin"); if(inp){inp.disabled=true; inp.classList.add(ok?"ok":"bad")}
  const card=$("#card");
  if(!ok&&!reduce){card.classList.remove("shake","enter");void card.offsetWidth;card.classList.add("shake")}
  $("#score").textContent=fmt(G.score); const cb=$("#combo"); cb.hidden=G.streak<2; cb.innerHTML=streakHtml();
  const h=$("#hearts"); if(h){h.outerHTML=flagsHtml(); if(!ok&&!item.retry&&!reduce) $("#hearts").classList.add("lose")}
  const last=G.i>=G.queue.length-1||G.flags<=0;
  const title=timedOut?"Time's up":ok?(item.retry?"Got it this time":PRAISE[Math.floor(Math.random()*PRAISE.length)]):"Not quite";
  const sub=ok?(item.retry?"No points on a retry, but it's cleared.":`+${fmt(pts)} pts${G.streak>=2?` · ${G.streak} in a row`:""}${mult()>1?` · ×${mult()} bonus`:""}`)
             :(item.retry?"It'll come back once more.":`−1 heart · ${G.flags} left. You'll see this one again.`);
  const showWhy=!ok;
  $("#fb").innerHTML=`<div class="fbsheet ${ok?"ok":"bad"}" role="status"><div class="fb-in">
    <div class="fb-head"><span class="fb-icon">${ok?CHECK:CROSS}</span><div class="fb-t"><strong>${title}</strong><span>${sub}</span></div></div>
    ${ok?"":`<p class="fb-ans"><span>Correct answer</span><b>${esc(correct)}</b></p>`}
    <p class="fb-why" id="why" ${showWhy?"":"hidden"}>${esc(c.why)}</p>
    <div class="fb-actions"><button class="btn fb-explain" id="explain" aria-expanded="${showWhy}">${showWhy?"Hide explanation":"Explain"}</button>
      <button class="btn big ${ok?"primary":"danger"}" id="next">${G.flags<=0?"See results":last?"Finish":"Continue"}</button></div>
  </div></div>`;
  const fit=()=>{const sh=$(".fbsheet"),sp=$("#spacer"); if(sh&&sp) sp.style.height=sh.offsetHeight+16+"px"};
  fit();
  $("#explain").onclick=()=>{const w=$("#why"),b=$("#explain"); w.hidden=!w.hidden; b.textContent=w.hidden?"Explain":"Hide explanation"; b.setAttribute("aria-expanded",String(!w.hidden)); fit()};
  $("#next").focus({preventScroll:true});
  $("#next").onclick=()=>{if(G.flags<=0)return finishQuick(false,true); G.i++; if(G.i>=G.queue.length)return finishQuick(false); renderQuick()};
}
function finishQuick(quit,audited){
  const r=R(CH); r.shifts++; const nb=G.score>r.best; if(nb)r.best=G.score; save();
  const acc=G.answered?Math.round(G.correct/G.answered*100):0;
  const verdict=audited?"Out of hearts":quit?"Round ended early":acc>=90?"Clean opinion":acc>=70?"Qualified opinion":"Needs adjusting entries";
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Results`);
  const mp=missPool().length;
  go(`<div class="narrow" style="display:flex;flex-direction:column;gap:22px">
  <section class="panel panel-pad enter"><div class="result-top">${ring(acc/100,96)}<div>
    <span class="eyebrow">${audited?"Out of hearts":"Books closed"}</span>
    <p class="verdict" style="color:${audited||acc<70?"var(--red)":"var(--accent)"}">${verdict}</p></div></div>
    <div class="statgrid"><div><b>${fmt(G.score)}</b><span>${nb?"New best":"Score"}</span></div><div><b>${G.correct}/${G.answered}</b><span>First-try correct</span></div><div><b>${G.bestStreak}</b><span>Best streak</span></div></div>
  </section>
  <section class="panel panel-pad enter"><h2>${G.missed.length?"Review these":"No misses this round"}</h2>
    ${G.missed.length?`<div class="misses">${G.missed.map(id=>{const c=BYID(id);const q=c.type==="sort"?c.item:c.type==="je"?c.scenario:c.prompt;
      return `<div class="miss"><p>${esc(q)}</p><p class="ans">${esc(c.type==="num"?"$"+fmt(c.ans):c.ans)}</p><p class="why">${esc(c.why)}</p></div>`}).join("")}</div>`:`<p style="margin:8px 0 0">Every card posted on the first try. ${G.promoted} cards moved up a level.</p>`}
  </section>
  <div class="row"><button class="btn primary big" id="again">Another round</button>${mp?`<button class="btn" id="drill">Drill misses (${mp})</button>`:""}<button class="btn quiet" id="back">Change settings</button></div></div>`);
  const r2=R(CH);
  $("#again").onclick=()=>startQuick("round",r2.qCount==="All"?CH.cards.length:r2.qCount);
  $("#back").onclick=()=>setup(CH);
  const d=$("#drill"); if(d) d.onclick=()=>startQuick("drill",Math.min(20,mp));
}

let samplerP=null; const sampler=()=>samplerP||(samplerP=(window.claude&&window.claude.use?window.claude.use("sample"):Promise.resolve(null)).catch(()=>null));

  const r=R(CH); const pool=CH.frqs.filter(f=>r.topics.includes(f.t));
  const list=pool.map(f=>{const x=r.frq[f.id];return {f,p:(x?x.best:-0.2)+Math.random()*0.3}}).sort((a,b)=>a.p-b.p).slice(0,n).map(x=>x.f.id);

}
function renderFrq(){
  const f=CH.frqs.find(x=>x.id===G.list[G.i]); G.f=f; G.ans=f.parts.map(()=>"" ); G.done=false; G.ctl=null;

      <textarea id="ans-${i}" aria-label="Answer to part ${"abcdefg"[i]}" spellcheck="false" placeholder="${/record|journal|entry|entries/i.test(p.q)?"Cash                     60,000\n    Notes Payable                   60,000":"Your answer…"}"></textarea>
      <div class="gslot" id="g-${i}"></div></div>`).join("")}</div>

function lockAnswers(){G.f.parts.forEach((_,i)=>{const t=$("#ans-"+i); if(t) t.readOnly=true})}
async function gradeAI(){
  const f=G.f; if(!G.ans.some(a=>a.trim())){$("#gmsg").textContent="Write at least one answer first.";return}
  const s=await sampler(); if(!s){aiOff=true;return gradeSelf()}
  lockAnswers();
  G.ctl=new AbortController();
  $("#gradebar").innerHTML=`<div class="grading"><span class="spin"></span><span>Claude is grading your answers…</span></div><button class="btn quiet" id="stop">Stop</button>`;
  $("#stop").onclick=()=>G.ctl&&G.ctl.abort();
  const prompt=[
   "You are grading a student's free-response answers for a university intermediate accounting course, Chapter 13 (Current Liabilities and Contingencies).",
   "Grade each part against its rubric. Award each rubric item's points fully when the student's answer satisfies it, half when partly right, else 0. Accept equivalent wording, reasonable account-name synonyms (e.g. Unearned Revenue for Deferred Revenue), and correct alternative calculations. Amounts must be correct. Ignore formatting and alignment.",
   "The professor requires complete account names in journal entries: if the student uses an abbreviation like A/P, N/P or A/R in place of an account name, deduct half a point from that item and say so.",
   "A blank answer earns 0. Keep feedback to 1–2 short, specific sentences addressed to the student ('you').",
   "", "PROBLEM: "+f.scenario, "",
   ...f.parts.map((p,i)=>[`PART ${"abcdefg"[i]} (${maxPts(p)} points): ${p.q}`, "Rubric:", ...p.rubric.map(x=>`- [${x[0]} pt] ${x[1]}`), "Model answer:", p.model, "Student answer:", '"""'+(G.ans[i].trim()||"(blank)")+'"""', ""].join("\n")),
   'Reply with only JSON in this shape: {"parts":[{"part":"a","score":2,"max":3,"feedback":"...","missed":["rubric item text not fully earned"]}]} with one entry per part, in order.'
  ].join("\n");
  try{
    const res=await s.json(prompt,{signal:G.ctl.signal,modelTier:"default"});
    const arr=Array.isArray(res?.parts)?res.parts:[];
    const grades=f.parts.map((p,i)=>{const g=arr[i]||{}; const mx=maxPts(p); let sc=Number(g.score); if(!isFinite(sc))sc=0; sc=Math.max(0,Math.min(mx,Math.round(sc*2)/2));

    const code=e&&e.code;

    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){aiOff=true;return gradeSelf("Claude grading isn't available here, so grade yourself against the rubric.")}

  }

  <div class="row"><button class="btn primary big" id="again">Another set</button><button class="btn quiet" id="back">Change settings</button></div></div>`);
  const r=R(CH);
  $("#again").onclick=()=>startFrq(r.fCount==="All"?CH.frqs.length:r.fCount);
  $("#back").onclick=()=>setup(CH);
}

/* keyboard (quick-fire) */
document.addEventListener("keydown",e=>{
  if(!G||G.kind!=="quick"||!$("#card")||$("#settings")) return;
  if(e.target.tagName==="INPUT"&&e.key!=="Enter") return;
  const kk=e.key.toLowerCase(); const idx="1234".includes(kk)&&kk?+kk-1:"abcd".indexOf(kk);
  if(!G.locked&&e.target.tagName!=="INPUT"&&kk.length===1&&idx>=0){const b=app.querySelectorAll(".opt")[idx]; if(b){e.preventDefault();b.click()}}
  else if(G.locked&&e.key==="Enter"){const n=$("#next"); if(n&&document.activeElement!==n){e.preventDefault();n.click()}}
});

sampler();
library();
})();
