<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ledger Rush: study games for intermediate accounting — quick-fire, Learn, flashcards, match and free response.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ledger Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a light ledger book. White header with a gilt rule; pale sage columnar paper; white ruled sheets hold each question. Deliberately light in every theme. */
:root{
  --bg:#F6F9F3; --surface:#FFFFFF; --surface-2:#F7FAF5; --ink:#16241C; --muted:#5C6C61;
  --line:#E3EBDD; --line-strong:#C3D3BB; --brand:#E3F0E2; --brand-2:#D3E7D3; --brand-ink:#1C4D35;
  --gilt:#B6862A; --accent:#22764A; --accent-ink:#FFFFFF; --red:#B3352C; --red-soft:#FBE8E5;
  --ok-soft:#E6F3E8; --gold-soft:#F7EED8; --margin:#EDB5AE; --shadow:0 1px 2px rgba(22,36,28,.06),0 8px 24px -12px rgba(22,36,28,.18);
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:light;
  --header:rgba(255,255,255,.92); --cover-a:#EEF6EC; --cover-b:#DCEBDA; --colline:#EBF1E6; --scrim:rgba(22,36,28,.35);
}
:root.lr-dark{
  --bg:#0F1612; --surface:#17211B; --surface-2:#1C2821; --ink:#E3ECE5; --muted:#98AA9E;
  --line:#26342C; --line-strong:#3B4F43; --brand:#1E3127; --brand-2:#2E4A3A; --brand-ink:#CFE6D4;
  --gilt:#D8AC52; --accent:#6CC490; --accent-ink:#0B1610; --red:#F07B70; --red-soft:#3A1F1C;
  --ok-soft:#183022; --gold-soft:#2E2715; --margin:#4E3330; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --header:rgba(23,33,27,.92); --cover-a:#20352A; --cover-b:#16271E; --colline:#131C17; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:repeating-linear-gradient(90deg,transparent 0 63px,var(--colline) 63px 64px);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gilt);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* cover band */
.cover{background:var(--header);backdrop-filter:blur(8px);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  border-bottom:2px solid var(--gilt);box-shadow:0 4px 18px -12px rgba(0,0,0,.3)}
.cover-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;background:none;border:0;padding:0;color:var(--brand-ink);display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
.crumbs{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.crumbs button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;letter-spacing:inherit;text-transform:inherit;font-size:inherit}
.cover-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--f-mono);font-size:14px}

.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:32px 72px;display:flex;flex-direction:column;gap:26px}
.narrow{max-width:780px;margin-inline:auto;width:100%}

h1.display{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,7vw,64px);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:6px 0 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-strong);background:var(--surface);
  padding:12px 20px;border-radius:12px;font-weight:700;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}
.btn:hover:not([disabled]){border-color:var(--ink)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 -1px color-mix(in srgb,var(--accent) 55%,#000)}
.btn.primary:hover:not([disabled]){border-color:var(--accent);filter:brightness(1.06)}
.btn.primary:active:not([disabled]){box-shadow:0 1px 0 -1px color-mix(in srgb,var(--accent) 55%,#000);transform:translateY(3px)}
.btn.big{padding:16px 26px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;font-weight:400;color:var(--muted);padding-inline:10px}
.btn.quiet:hover{color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-pad{padding:22px}
@media (max-width:520px){.panel-pad{padding:18px}}

/* library */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.book{display:flex;flex-direction:column;overflow:hidden;padding:0;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.book:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 18px 34px -16px rgba(22,36,28,.35)}
.book-cover{background:var(--brand);color:var(--brand-ink);padding:20px 20px 18px;position:relative;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;
  background-image:linear-gradient(90deg,var(--brand-2) 0 10px,transparent 10px 14px,var(--line-strong) 14px 15px,transparent 15px),linear-gradient(160deg,var(--cover-a),var(--cover-b))}
.book-cover .num{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.8;color:var(--gilt);letter-spacing:-.04em;padding-left:10px}
.book-cover .ttl{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15;padding-left:10px;text-wrap:balance}
.book-cover .eyebrow{color:var(--muted);padding-left:10px}
.book-body{padding:16px 20px 18px;display:flex;align-items:center;gap:16px}
.book-stats{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted);min-width:0}
.book-stats b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.ring{flex:none}
.ring text{font-family:var(--f-mono);font-weight:600;font-size:13px;fill:var(--ink)}
.book.add{border:2px dashed var(--line-strong);background:transparent;box-shadow:none;justify-content:center;padding:26px;gap:10px;cursor:default}
.book.add:hover{transform:none}
.book.add strong{font-family:var(--f-display);font-size:19px}
.book.add p{margin:0;color:var(--muted);font-size:14px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.step{display:flex;flex-direction:column;gap:12px}
.step + .step{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.step-h{display:flex;align-items:baseline;gap:10px}
.step-h .eyebrow{color:var(--gilt);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);min-width:0;transition:border-color .12s,background .12s}
.mode:hover{border-color:var(--line-strong)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--ok-soft)}
.mode .mi{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.mode .mi svg{width:24px;height:24px;flex:none;color:var(--accent)}
.mode p{margin:0;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 16px;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;transition:all .12s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.topics{display:flex;flex-direction:column;gap:8px}
.tp{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.tp .box{width:20px;height:20px;border:2px solid var(--line-strong);border-radius:6px;display:grid;place-items:center}
.tp[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.tp[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tp[aria-pressed="false"]{opacity:.62}
.tp .nm{min-width:0}
.tp .nm strong{display:block;font-weight:700;font-size:15px}
.tp .nm small{color:var(--muted);font-size:13px}
.meter{display:flex;gap:3px}
.meter i{width:10px;height:14px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--accent)}
.summary{position:sticky;top:90px;display:flex;flex-direction:column;gap:16px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;text-align:right;font-family:var(--f-mono);font-weight:600}
.note{font-size:13.5px;color:var(--muted);margin:0}
.tiny-actions{display:flex;gap:4px;flex-wrap:wrap}

/* HUD */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--f-mono);font-size:14px;box-shadow:var(--shadow)}
.pill b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.combo{color:var(--gilt);font-weight:600}
.flags{display:flex;gap:2px;margin-left:auto}
.flags svg{width:22px;height:22px}
.flags .lost{opacity:.18}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.timer{height:3px;margin-top:5px;border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gilt);width:100%}

/* sheet (question card) */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;
  padding:24px 24px 24px 60px;
  background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px 41px,transparent 41px,transparent 44px,var(--margin) 44px 45px,transparent 45px)}
@media (max-width:520px){.sheet{padding:20px 16px 20px 46px;background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px 31px,transparent 31px)}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.retry{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.prompt{font-size:clamp(19px,3.4vw,23px);line-height:1.4;margin:0 0 18px;font-weight:700;text-wrap:pretty}
.scenario{margin:0 0 14px;font-size:16.5px}
.big-item{font-family:var(--f-display);font-weight:700;font-size:clamp(23px,4.4vw,32px);line-height:1.15;margin:6px 0 20px;text-wrap:balance;letter-spacing:-.01em}
.je-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px}
table.je{border-collapse:collapse;width:100%;min-width:430px;font-size:15px}
table.je th{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--surface-2);border-bottom:1.5px solid var(--line-strong)}
table.je td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.je tr:last-child td{border-bottom:0}
table.je td.amt,table.je th.amt{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:112px;border-left:1px solid var(--line)}
table.je td.cr-acct{padding-left:36px}
table.je td.date{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;width:1%}
.blank{display:inline-block;min-width:74px;padding:1px 10px;border:2px dashed var(--gilt);border-radius:6px;color:var(--gilt);background:var(--gold-soft);font-family:var(--f-mono);font-weight:600;text-align:center}
.blank.ok{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--ok-soft)}
.blank.bad{border-style:solid;border-color:var(--red);color:var(--red);background:var(--red-soft)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.sort{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.opts,.opts.sort{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 15px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;min-width:0;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--ink);transform:translateY(-1px)}
.opt kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--muted);flex:none;margin-top:2px;background:var(--surface-2)}
.opt span{min-width:0}
.opt.amount span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.opt.ok{border-color:var(--accent);background:var(--ok-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.opts.sort .opt{justify-content:center;text-align:center;font-weight:700;padding:18px 10px}
.numrow{display:flex;gap:10px;flex-wrap:wrap}
.numrow label{position:relative;flex:1 1 220px;min-width:0}
.numrow label::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);color:var(--muted)}
.numrow input{width:100%;padding:13px 14px 13px 30px;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:10px}
.feedback{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);display:flex;flex-direction:column;gap:10px}
.feedback.bad{background:var(--red-soft)}
.feedback p{margin:0}
.feedback .row{justify-content:space-between}
.feedback .pts{font-family:var(--f-mono);font-weight:600}
.stamp{position:absolute;right:20px;top:18px;font-family:var(--f-mono);font-weight:600;font-size:17px;letter-spacing:.16em;padding:4px 12px;border:3px double currentColor;border-radius:6px;transform:rotate(-7deg);opacity:.92;pointer-events:none;background:var(--surface)}
.stamp.ok{color:var(--accent)} .stamp.bad{color:var(--red)}

/* FRQ */
.exhibit{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--gilt);border-radius:10px;padding:14px 16px;margin:0 0 20px;font-size:16.5px}
.parts{display:flex;flex-direction:column;gap:22px}
.part{display:flex;flex-direction:column;gap:10px}
.part-h{display:flex;gap:12px;align-items:flex-start}
.part-h .lt{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ok-soft);color:var(--accent);border:1.5px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.part-h p{margin:3px 0 0;font-weight:700;flex:1;min-width:0}
.part-h .pt{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:5px}
.part textarea{width:100%;min-height:118px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface-2);font-family:var(--f-mono);font-size:14.5px;line-height:1.6}
.part textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.part textarea[readonly]{opacity:.85}
.grade{border-radius:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.grade.full{background:var(--ok-soft);border-color:transparent}
.grade.part0{background:var(--red-soft);border-color:transparent}
.grade.partial{background:var(--gold-soft);border-color:transparent}
.grade .gh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grade .score{font-family:var(--f-mono);font-weight:600;font-size:15px}
.grade ul{margin:0;padding-left:20px;font-size:14px}
.grade p{margin:0;font-size:15px}
details.model summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
pre.model{margin:8px 0 0;white-space:pre-wrap;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.rubric{display:flex;flex-direction:column;gap:6px}
.rubric label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.rubric input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.rubric .rp{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;margin-left:auto;padding-left:8px;white-space:nowrap}
.grading{display:flex;gap:12px;align-items:center;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tipbar{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0 0 18px}
.tipbar svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--gilt)}
.msg{font-size:14px;color:var(--red);margin:0}

/* results */
.result-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:560px){.result-top{grid-template-columns:1fr}}
.verdict{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,6vw,50px);line-height:1;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:18px}
.statgrid div{padding:14px 4px 0;min-width:0}
.statgrid b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.statgrid span{font-size:12.5px;color:var(--muted)}
.misses{display:flex;flex-direction:column}
.miss{padding:14px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss p{margin:0}
.miss .ans{font-weight:700;color:var(--accent);margin-top:3px}
.miss .why{font-size:14px;color:var(--muted);margin-top:3px}
.foot{font-size:13px;color:var(--muted);text-align:center}
.linkish{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:13px}

<script>
(function(){
/* ================= Chapter 13 content ================= */
const TOPICS = [
  {id:"basics",   name:"Liability basics",                      note:"Definition, current vs. noncurrent, accounts payable"},
  {id:"notes",    name:"Notes payable",                         note:"Interest-bearing and zero-interest-bearing notes"},
  {id:"loans",    name:"Credit lines, loans, commercial paper", note:"Committed vs. noncommitted, secured vs. unsecured"},
  {id:"payroll",  name:"Accrued & employee liabilities",        note:"Wages, FICA, compensated absences, sick pay, bonuses"},
  {id:"advance",  name:"Advance collections & dividends",       note:"Deposits, unearned revenue, gift cards, sales tax"},
  {id:"classify", name:"Maturities, refinancing, callable debt",note:"When long-term debt turns current, and when it doesn't"},
  {id:"contingent",name:"Contingencies & warranties",           note:"Accrue vs. disclose, warranties, litigation"}
];
const SETS = {cls:["Current","Noncurrent","Not a liability"],cont:["Accrue","Disclose only","Neither"],absent:["Must accrue","Company may choose","Usually not accrued"]};
const SET_Q = {cls:"Where does it go on the balance sheet?",cont:"How is it reported?",absent:"Accrue a liability?"};
const C = [];
const mc  = (id,t,prompt,opts,why)=>C.push({id,t,type:"mc",prompt,opts,ans:opts[0],why});
const srt = (id,t,set,item,ans,why)=>C.push({id,t,type:"sort",set,item,opts:SETS[set],ans,why});
const num = (id,t,prompt,ans,why)=>C.push({id,t,type:"num",prompt,ans,why});
const je  = (id,t,scenario,date,lines,blank,opts,why,hide)=>{const [i,f]=blank;const ans=f==="acct"?lines[i][0]:(f==="dr"?lines[i][1]:lines[i][2]);C.push({id,t,type:"je",scenario,date,lines,blank,opts,ans,why,hide:hide||[]})};

/* Liability basics */
mc("b1","basics","Which is NOT one of the three essential characteristics of a liability?",
 ["The exact payee and due date must be known","It is a probable future sacrifice of economic resources","It arises from a present obligation to transfer assets or provide services","It results from a past transaction or event"],
 "A liability is (1) a probable future sacrifice, an unavoidable obligation, (2) a present obligation settled with cash, assets or services, and (3) the result of a past transaction. The payee and date don't have to be known.");
mc("b2","basics","A current liability is expected to use current assets and is payable within…",
 ["1 year or the operating cycle, whichever is longer","1 year or the operating cycle, whichever is shorter","Exactly 12 months, always","90 days"],
 "Current = requires current assets AND is payable within 1 year or the operating cycle, whichever is longer.");
mc("b3","basics","Current liabilities are reported on the balance sheet at…",
 ["Their maturity amount","Present value","Fair value at year-end","Original cost less amortization"],
 "Technically they should be at present value, but they're so short-term that the difference is immaterial.");
mc("b4","basics","Why would a business rather have a liability classified as noncurrent?",
 ["It improves liquidity ratios like working capital and the current ratio","Noncurrent liabilities carry no interest","Noncurrent liabilities stay off the balance sheet","Auditors don't review noncurrent liabilities"],
 "Current liabilities come due sooner and add risk. Noncurrent classification improves working capital and the current ratio, which loan contracts often restrict.");
mc("b5","basics","What is the only formal document involved in an account payable?",
 ["The invoice from the creditor","A signed promissory note","A board resolution","A bank confirmation"],
 "The invoice states the due date and the exact amount needed to settle. Accounts payable are usually due in 30–60 days.");
mc("b6","basics","Accounts payable arise because of…",
 ["The time lag between receiving goods or services and paying for them","A written promise to pay on a specified future date","Collecting cash from customers before delivering","A board declaring a dividend"],
 "Accounts payable are balances owed for goods, supplies or services bought on open account. A written promise to pay is a note payable.");
srt("b7","basics","cls","Accounts payable due in 45 days","Current","Trade payables are due within 30–60 days, so they're current.");
srt("b8","basics","cls","Unearned revenue for a service to be performed next quarter","Current","Unearned (deferred) revenue is a current liability: you owe a product or service soon.");
srt("b9","basics","cls","A declared cash dividend payable next month","Current","Declared cash dividends are always paid within a year of declaration, so they're current.");
srt("b10","basics","cls","Undeclared dividends in arrears on cumulative preferred stock","Not a liability","They're not an obligation until the board declares them. Disclose in a note or parenthetically in the stock section.");
srt("b11","basics","cls","A declared stock dividend","Not a liability","Stock dividends require no future outlay of assets or services, so they're not a liability.");

/* Notes payable */
const LAND = "Castle National Bank lends Landscape Co. $100,000 on March 1. Landscape signs a $100,000, 6%, 4-month note and prepares statements semiannually.";
mc("n1","notes","Notes payable are best described as…",

frq("f2","notes","Zero-interest-bearing note",
 "On April 1, Harbor Co. borrows from City Bank by issuing a 6-month, $84,000 noninterest-bearing note. The bank applies a 10% discount rate.",
 [P("Record the April 1 journal entry.", J([["Cash","79,800",""],["Discount on Notes Payable","4,200",""],["Notes Payable","","84,000"]])+"\n\n$84,000 × 10% × 6/12 = $4,200",
    [[1,"Discount computed as $4,200"],[1,"Debit Cash $79,800"],[1,"Debit Discount on Notes Payable $4,200"],[1,"Credit Notes Payable $84,000 (face value)"]]),
  P("Show how the note appears in current liabilities on April 1.", "Current Liabilities\n  Notes Payable                       84,000\n  Less: Discount on Notes Payable     (4,200)     79,800",
    [[1,"Notes Payable shown at $84,000 face"],[1,"Discount subtracted as a contra account"],[1,"Net carrying amount $79,800"]]),
  P("Record the entries on October 1 when the note matures and is paid.", J([["Interest Expense","4,200",""],["Discount on Notes Payable","","4,200"],["Notes Payable","84,000",""],["Cash","","84,000"]]),
    [[1,"Debit Interest Expense / credit Discount on Notes Payable $4,200"],[1,"Debit Notes Payable / credit Cash $84,000"]]),
  P("Explain why a \"zero-interest\" note still produces interest expense.", "No lender lends for free. The interest isn't stated on the note; the bank takes it up front. The borrower receives only the present value ($79,800) but repays the full face value ($84,000), and that $4,200 difference is the interest.",
    [[1,"Interest is deducted up front / built into the face amount"],[1,"Borrower receives less than face (present value) but repays face; the difference is interest"]])]);

frq("f3","payroll","Accrued wages at month-end",
 "Brightline Co. pays its one employee $150 per day, every two weeks. On March 31 (month-end) the employee has worked 3 days since the last payday. The next payday, April 7, covers 10 working days.",
 [P("Record the March 31 adjusting entry.", J([["Salaries and Wages Expense","450",""],["Salaries and Wages Payable","","450"]])+"\n\n$150 × 3 days",
    [[1,"Debit Salaries and Wages Expense $450"],[1,"Credit Salaries and Wages Payable $450"]]),
  P("Record the April 7 payroll entry.", J([["Salaries and Wages Payable","450",""],["Salaries and Wages Expense","1,050",""],["Cash","","1,500"]])+"\n\nApril expense: $150 × 7 days = $1,050",
    [[1,"Debit Salaries and Wages Payable $450"],[1,"Debit Salaries and Wages Expense $1,050 (7 April days)"],[1,"Credit Cash $1,500"]]),
  P("Why is the March 31 accrual necessary?", "The wages were earned (an expense incurred) in March but won't be paid until April. Under accrual accounting the expense belongs in March, and the unpaid amount is a present obligation, so it's recorded as an accrued liability.",
    [[1,"Expense was incurred in March but not yet paid"],[1,"Creates a liability / matches expense to the period"]])]);

frq("f4","payroll","Compensated absences",
 "Linden Corp. began operations January 1, 20X5. It has 8 employees, each paid $600 per week. Each employee earned 2 weeks of vacation in 20X5 and took none. In 20X6 they use the vacation, but weekly pay has risen to $650. Linden accrues at the current wage rate.",
 [P("Record the December 31, 20X5 accrual.", J([["Salaries and Wages Expense","9,600",""],["Salaries and Wages Payable","","9,600"]])+"\n\n$600 × 8 × 2",
    [[1,"Amount $9,600"],[1,"Debit Salaries and Wages Expense"],[1,"Credit Salaries and Wages Payable"]]),
  P("Record the 20X6 payment of the vacation pay.", J([["Salaries and Wages Payable","9,600",""],["Salaries and Wages Expense","800",""],["Cash","","10,400"]])+"\n\nCash: $650 × 8 × 2 = $10,400",
    [[1,"Debit Salaries and Wages Payable $9,600"],[1,"Debit Salaries and Wages Expense $800 for the raise"],[1,"Credit Cash $10,400"]]),
  P("List the four conditions that require accruing compensated absences.", "1. The obligation relates to employee services already rendered.\n2. The rights vest or accumulate (can be taken in a later year).\n3. Payment is probable.\n4. The amount can be reasonably estimated.",
    [[1,"Services already rendered"],[1,"Rights vest or accumulate"],[1,"Payment is probable"],[1,"Amount reasonably estimable"]]),
  P("If Linden met every condition except being able to estimate the amount, what should it do?", "Don't accrue a liability, but disclose the fact in the notes to the financial statements.",
    [[1,"No accrual"],[1,"Disclose in the notes"]])]);

frq("f5","payroll","FICA for a high earner",
 "Morgan earns $190,000 in 2025. Social Security tax is 6.2% on wages up to $184,500. Medicare tax is 1.45% of all wages.",
 [P("Compute the Social Security tax withheld from Morgan.", "$184,500 × 6.2% = $11,439\n(Wages above the $184,500 limit aren't taxed.)",
    [[1,"Applies the $184,500 limit"],[1,"Correct amount $11,439"]]),
  P("Compute the Medicare tax withheld from Morgan.", "$190,000 × 1.45% = $2,755 (no wage limit)",
    [[1,"Uses all $190,000 of wages"],[1,"Correct amount $2,755"]]),
  P("How much FICA does the employer owe for Morgan, and how are withheld-but-unpaid amounts reported?", "The employer matches at the same rates: $11,439 + $2,755 = $14,194. Amounts withheld or owed but not yet remitted to the government are current liabilities.",
    [[1,"Employer matches: $14,194"],[1,"Unremitted amounts are current liabilities"]])]);

frq("f6","advance","Gift cards and sales tax",
 "During June, Cobalt Outfitters sold $500,000 of gift cards. Customers redeemed $350,000 of cards (from June and earlier), and $40,000 of older cards expired unused. Separately, Cobalt sold merchandise for $2,500 cash where the sales tax rate is 7%.",
 [P("Record the June gift card sales.", J([["Cash","500,000",""],["Deferred Revenue","","500,000"]]),
    [[1,"Debit Cash $500,000"],[1,"Credit Deferred (Unearned) Revenue $500,000"]]),
  P("Record the redemptions and expirations.", J([["Deferred Revenue","390,000",""],["Sales Revenue","","390,000"]])+"\n\n$350,000 redeemed + $40,000 breakage",
    [[1,"Debit Deferred Revenue"],[1,"Credit Sales Revenue"],[1,"Amount includes breakage: $390,000"]]),
  P("Record the $2,500 merchandise sale.", J([["Cash","2,675",""],["Sales","","2,500"],["Sales Taxes Payable","","175"]]),
    [[1,"Debit Cash $2,675"],[1,"Credit Sales $2,500"],[1,"Credit Sales Taxes Payable $175"]]),
  P("Why isn't the $175 revenue?", "Cobalt collects it on behalf of a third party, the state and local government. It owes that cash to the tax authority, so it's a liability until remitted.",
    [[1,"Collected for a third party (government)"],[1,"It's a liability until paid"]])]);

frq("f7","classify","Refinancing short-term obligations",
 "At December 31, 2027 (fiscal year-end), Tamarack Inc. has $9 million of notes due April 2028 and $3 million of bonds due February 2028. Management intends to refinance both on a long-term basis. On February 10, 2028, Tamarack issues $2.5 million of 15-year bonds and uses the proceeds plus other cash to retire the $3 million of bonds. On March 1, before the 2027 statements are issued, it signs an agreement allowing it to borrow up to $6 million for 3 years.",
 [P("How should the $9 million of notes be classified at December 31, 2027?", "$6 million long-term and $3 million current. The refinancing agreement demonstrates the ability to refinance only $6 million.",
    [[1,"$6 million noncurrent"],[1,"$3 million current"],[1,"Reason: the agreement only covers $6 million"]]),
  P("How should the $3 million of bonds be classified?", "$2.5 million long-term and $0.5 million current. An actual refinancing before issuance demonstrates ability, but the amount excluded from current liabilities can't exceed the proceeds of the new obligation ($2.5 million).",
    [[1,"$2.5 million noncurrent"],[1,"$0.5 million current"],[1,"Excluded amount can't exceed new proceeds"]]),
  P("State the two conditions that let a short-term obligation be reported as noncurrent.", "1. Intent to refinance on a long-term basis (it won't use working capital next year).\n2. Demonstrated ability to refinance, either an existing refinancing agreement or an actual refinancing after the balance sheet date but before the statements are issued.",
    [[1,"Intent to refinance long-term"],[1,"Demonstrated ability"],[1,"Ability = agreement OR actual refinancing between balance sheet date and issuance"]])]);

frq("f8","contingent","Contingencies at year-end",
 "Evaluate each situation for Ardent Corp.'s December 31 financial statements. Say whether to accrue, disclose, or do neither, and give the journal entry if one is needed.",
 [P("A customer sued in October over a defective product. Counsel says a loss is probable, and the likely settlement is $400,000.", "Accrue: probable and reasonably estimable.\n\n"+J([["Litigation Loss (or Expense)","400,000",""],["Litigation Liability","","400,000"]]),
    [[1,"Accrue"],[1,"Reason: probable AND reasonably estimable"],[1,"Debit loss/expense, credit liability $400,000"]]),
  P("A competitor's patent suit could reasonably possibly cost Ardent $1 million.", "Disclose in the notes only. Reasonably possible losses aren't accrued.",
    [[1,"Disclose only"],[1,"Reasonably possible is not enough to accrue"]]),
  P("A loss from an environmental claim is probable, but no reasonable estimate can be made.", "Disclose only. Both conditions are required to accrue, and the amount can't be estimated.",
    [[1,"Disclose only"],[1,"Fails the reasonably-estimable condition"]]),
  P("Ardent will very probably win a material $200,000 tax refund dispute.", "Gain contingency: never accrued (conservatism). Disclose in the notes because it's material and highly probable.",
    [[1,"Don't accrue a gain"],[1,"Disclose if material and highly probable"]]),
  P("A lawsuit filed in January concerns an accident that happened in December. How does timing affect the decision?", "The cause occurred before year-end, so it can be accrued for December 31 if the loss is probable and reasonably estimable. The suit doesn't need to be filed during the period. Otherwise, disclose.",
    [[1,"Cause before year-end is what matters"],[1,"Accrue if probable and estimable; filing date doesn't matter"]])]);

frq("f9","contingent","Warranties and extended warranties",
 "Sterling Tools sells $800,000 of drills in 2027 with a 2-year warranty. Warranty costs are estimated at 2% of sales in year one and 3% in year two. In 2028 it spends $15,000 on claims. On January 1, 2028, Sterling also sells a separately priced 3-year extended warranty for $90.",
 [P("Record the December 31, 2027 warranty adjusting entry.", J([["Warranty Expense","40,000",""],["Estimated Warranty Liability","","40,000"]])+"\n\n(2% + 3%) × $800,000",
    [[1,"Amount $40,000"],[1,"Debit Warranty Expense"],[1,"Credit Estimated Warranty Liability"]]),
  P("Record the 2028 warranty claims.", J([["Estimated Warranty Liability","15,000",""],["Cash (or Inventory, Wages Payable)","","15,000"]]),
    [[1,"Debit Estimated Warranty Liability $15,000"],[1,"Credit Cash / inventory / wages, not an expense"]]),
  P("Record the extended warranty sale and the December 31, 2028 entry.", "Jan 1, 2028\n"+J([["Cash","90",""],["Unearned Warranty Revenue","","90"]])+"\n\nDec 31, 2028\n"+J([["Unearned Warranty Revenue","30",""],["Warranty Revenue","","30"]]),
    [[1,"Sale credits Unearned (Deferred) Warranty Revenue $90"],[1,"Year-end recognizes $30 (straight-line, $90 ÷ 3)"]]),
  P("Why is extended-warranty revenue deferred while the regular warranty is expensed at the sale?", "The extended warranty is sold separately, so it's a separate obligation to perform service over the contract's life; revenue is earned straight-line over that period. The regular warranty is a loss contingency that's probable and estimable, so its estimated cost is accrued as an expense in the period of sale.",
    [[1,"Extended warranty = separate service obligation earned over the contract"],[1,"Regular warranty = probable, estimable loss contingency accrued at sale"]])]);

frq("f10","basics","Liability concepts",
 "Answer each part in a few sentences.",
 [P("State FASB's three essential characteristics of a liability.", "1. A probable future sacrifice of economic resources (an unavoidable obligation).\n2. Arises from a present obligation to transfer assets or provide services.\n3. Results from a past transaction or event.",
    [[1,"Probable future sacrifice"],[1,"Present obligation to transfer assets or services"],[1,"Results from a past transaction"]]),
  P("Define a current liability and say how it's measured.", "An obligation expected to require current assets and payable within one year or the operating cycle, whichever is longer. Reported at maturity amount, since the difference from present value is immaterial.",
    [[1,"Uses current assets"],[1,"Within 1 year or operating cycle, whichever is longer"],[1,"Reported at maturity amount"]]),
  P("Why do companies prefer noncurrent classification?", "Current liabilities come due sooner and add risk. Noncurrent classification improves liquidity ratios like working capital and the current ratio, which loan agreements often restrict.",
    [[1,"Improves working capital / current ratio"],[1,"Loan covenants often restrict these ratios, or current debt adds risk"]]),
  P("A covenant violation makes long-term debt callable unless fixed within a 60-day grace period. How is it classified?", "Current, because the creditor can call it within the year, unless it's probable the company will cure the violation within the grace period or the creditor waives it. Then it can stay noncurrent.",
    [[1,"Current by default"],[1,"Noncurrent only if cure within grace period is probable or creditor waives"]])]);

frq("f11","payroll","Sick pay, holidays, bonuses",
 "Answer each part. Use complete account names in journal entries.",
 [P("When must sick pay be accrued, and when is accrual optional?", "If sick pay vests, it must be accrued. If it accumulates but doesn't vest and is paid only when illness causes the absence, accrual is optional. If employees can take accumulated sick days even when not ill, it must be accrued.",
    [[1,"Vesting sick pay must be accrued"],[1,"Accumulating, non-vesting, paid only if ill: optional"],[1,"Usable even when not ill: must accrue"]]),
  P("Why aren't holidays, jury duty and maternity leave usually accrued? When could holidays be accrued?", "They don't accumulate if unused. Holidays could be accrued only if employees work a holiday and can carry it forward for probable future compensation.",
    [[1,"They don't accumulate if unused"],[1,"Holidays: only if worked and carried forward"]]),
  P("Fulton Inc. will pay $18,000 of 20X3 bonuses in January 20X4. Record the December 31 and January entries.", "Dec 31, 20X3\n"+J([["Salaries and Wages Expense","18,000",""],["Salaries and Wages Payable","","18,000"]])+"\n\nJan 20X4\n"+J([["Salaries and Wages Payable","18,000",""],["Cash","","18,000"]]),
    [[1,"Dec 31: debit Salaries and Wages Expense, credit Salaries and Wages Payable $18,000"],[1,"January: debit Salaries and Wages Payable, credit Cash $18,000"],[1,"Treats bonus as additional wages (expense), not a distribution"]])]);

frq("f12","loans","Financing and dividends",
 "Answer each part briefly.",
 [P("Compare a committed and a noncommitted line of credit.", "Committed: a formal agreement, usually with a commitment fee to keep the line available. Noncommitted: an informal agreement letting the borrower borrow up to a preset limit without formal loan procedures.",
    [[1,"Committed = formal, commitment fee"],[1,"Noncommitted = informal, up to a preset limit"]]),
  P("Compare secured and unsecured loans. Which usually has the lower rate?", "Secured loans require collateral (usually receivables or inventory) that the lender can seize on default. Unsecured loans rest only on creditworthiness. Secured loans usually carry lower rates.",
    [[1,"Secured = pledged collateral (A/R or inventory)"],[1,"Unsecured = creditworthiness only"],[1,"Secured has the lower rate"]]),
  P("Describe commercial paper.", "Unsecured, short-term (30–270 day) notes sold by large corporations, in $25,000 denominations, with interest usually discounted at issuance.",
    [[1,"Unsecured and short-term (30–270 days)"],[1,"Large corporations; $25,000 denominations or discounted interest"]]),
  P("How are declared cash dividends, declared stock dividends and cumulative preferred dividends in arrears reported?", "Declared cash dividends: current liability (paid within a year). Stock dividends: not a liability (no outlay of assets). Dividends in arrears: not a liability until declared; disclose in a note or parenthetically.",
    [[1,"Cash dividends declared = current liability"],[1,"Stock dividends = not a liability"],[1,"Arrears = not a liability; disclosed"]])]);


/* ---- key terms (flashcards + match) ---- */
const TERMS=[];
const term=(t,termTxt,def)=>TERMS.push({id:"t"+(TERMS.length+1),t,term:termTxt,def});
term("basics","Liability","A probable future sacrifice of economic benefits from a present obligation, arising from a past transaction.");
term("basics","Current liability","An obligation that uses current assets and is payable within 1 year or the operating cycle, whichever is longer.");
term("basics","Noncurrent liability","An obligation not due within 1 year or the operating cycle; also called a long-term liability.");
term("basics","Accounts payable","Balances owed for goods, supplies or services bought on open account, usually due in 30–60 days.");
term("basics","Maturity amount","What current liabilities are reported at, since the difference from present value is immaterial.");
term("notes","Notes payable","Written promises to pay a certain sum of money on a specified future date.");
term("notes","Interest-bearing note","A note where the borrower repays face value plus interest at a stated annual rate.");
term("notes","Zero-interest-bearing note","A note with no stated rate: the borrower receives its present value and repays the face value.");
term("notes","Discount on Notes Payable","A contra account to Notes Payable for interest the lender takes up front.");
term("notes","Stated rate","The annual interest rate printed on a note; scale it by months outstanding ÷ 12.");
term("loans","Line of credit","An agreement providing short-term financing that the borrower can draw on when needed.");
term("loans","Committed line of credit","A formal credit agreement that usually requires a commitment fee to keep it available.");
term("loans","Noncommitted line of credit","An informal agreement to borrow up to a preset limit without formal loan paperwork.");
term("loans","Secured loan","A loan backed by pledged collateral, usually receivables or inventory.");
term("loans","Unsecured loan","A signature loan supported only by the borrower's creditworthiness.");
term("loans","Commercial paper","Unsecured 30–270 day notes sold by large corporations in $25,000 denominations.");
term("payroll","Accrued liability","An expense that has been incurred but not yet paid in cash.");
term("payroll","Salaries and Wages Payable","Wage expense already incurred but not yet paid to employees.");
term("payroll","FICA","Federal payroll tax funding Social Security and Medicare, paid by both employer and employee.");
term("payroll","Social Security tax","6.2% each for employer and employee, on pay up to an annual limit.");
term("payroll","Medicare tax","1.45% each for employer and employee, on all compensation.");
term("payroll","Compensated absences","Paid absences from work, such as vacation and sick days.");
term("payroll","Vested benefit","A benefit the employee is paid for even if terminated.");
term("payroll","Accumulated benefit","An unused benefit that carries forward to later periods.");
term("payroll","Bonus","Additional wages, often tied to profit, recorded as an expense.");
term("advance","Refundable deposit","Cash collected from a customer that will be returned at a later date.");
term("advance","Unearned revenue","Cash received before it is earned; also called deferred revenue.");
term("advance","Breakage","Recognizing gift card revenue once redemption becomes remote, e.g. the card expires.");
term("advance","Redemption","Recognizing gift card revenue when the customer uses the card.");
term("advance","Sales Taxes Payable","Tax collected from customers on behalf of the state and local government.");
term("advance","Dividends payable","Cash dividends declared by the board; always a current liability.");
term("advance","Dividends in arrears","Undeclared cumulative preferred dividends: disclosed, never recorded as a liability.");
term("classify","Current maturities of long-term debt","The portion of long-term debt due within the next year, reported as current.");
term("classify","Refinancing exception","A short-term obligation reported as noncurrent because of intent plus demonstrated ability to refinance.");
term("classify","Callable obligation","Debt the creditor can demand within the year; current even if not expected to be called.");
term("classify","Grace period","Time allowed to cure a covenant violation before the debt becomes callable.");
term("contingent","Contingency","An existing uncertain situation whose gain or loss is resolved by future events.");
term("contingent","Gain contingency","An uncertain situation that might produce a gain; never accrued, only disclosed.");
term("contingent","Loss contingency","An uncertain situation that might produce a loss; accrued if probable and estimable.");
term("contingent","Probable","The future event is likely to occur.");
term("contingent","Reasonably possible","The chance of the event is more than remote but less than likely.");
term("contingent","Remote","The chance of the future event is slight.");
term("contingent","Warranty","A seller's promise to make good on a product's quantity, quality or performance.");
term("contingent","Estimated Warranty Liability","The expected cost of warranty claims, accrued in the period of sale.");
term("contingent","Extended warranty","A separately sold warranty whose revenue is deferred and recognized straight-line.");
term("contingent","Rebate","Cash returned to the customer later, reducing the net amount they paid.");
term("contingent","Premium","A noncash item, like a toy or dishes, given in return for proofs of purchase.");

/* ---- Learn mode: select-all-that-apply questions ---- */
const LQ=[];
const lq=(id,t,prompt,correct,wrong,why)=>LQ.push({id,t,prompt,correct,wrong,why});
lq("L1","basics","Which are essential characteristics of a liability?",["It is a probable future sacrifice of economic resources","It arises from a present obligation to transfer assets or provide services","It results from a past transaction or event"],["The payee and exact due date must be known","It must bear interest","It must be payable within one year"],"FASB: a probable future sacrifice, from a present obligation, resulting from a past transaction. The payee and date don't need to be known.");
lq("L2","basics","Which describe a current liability?",["Expected to require the use of current assets","Payable within 1 year or the operating cycle, whichever is longer","Reported at its maturity amount"],["Payable within 1 year or the operating cycle, whichever is shorter","Always reported at present value","Must be secured by collateral"],"Current liabilities use current assets, are due within 1 year or the operating cycle (whichever is longer), and are reported at maturity amount because the PV difference is immaterial.");
lq("L3","basics","Which are examples of current liabilities?",["Accounts payable","Unearned revenues","Declared cash dividends payable","Current maturities of long-term debt"],["Declared stock dividends","Dividends in arrears on cumulative preferred stock","Prepaid insurance","Bonds payable due in 10 years"],"Stock dividends and dividends in arrears aren't liabilities at all.");
lq("L4","basics","Why do companies prefer to classify liabilities as noncurrent?",["It improves the current ratio","It improves working capital","Loan contracts often restrict these liquidity ratios"],["Noncurrent liabilities carry no interest","Noncurrent liabilities aren't reported on the balance sheet","Noncurrent liabilities never need to be disclosed"],"Current liabilities come due sooner and hurt liquidity ratios that loan contracts often restrict.");
lq("L5","basics","Which are true about accounts payable?",["They arise from the time lag between receiving goods or services and paying for them","They're usually due within 30–60 days","The only formal document is the creditor's invoice"],["They require a signed promissory note","They always bear interest","They're usually due within 10 days"],"A/P is owed on open account; the invoice states the due date and exact amount.");
lq("L6","notes","Which are true about notes payable?",["They are written promises to pay a certain sum on a specified future date","They can be short-term or long-term depending on the due date","They can be interest-bearing or zero-interest-bearing"],["They are always long-term","The only document is an invoice","They never arise from bank loans"],"Notes can come from purchases, financing or cash loans, and can be either term.");
lq("L7","notes","On a zero-interest-bearing note, which are true?",["The borrower receives the present value of the note","The borrower repays the face value at maturity","Interest is still charged, just not stated on the note"],["No interest cost is ever incurred","The borrower receives the face value up front","Discount on Notes Payable is an asset"],"The bank takes its fee up front: the borrower gets PV and repays face value.");
lq("L8","notes","Which describe Discount on Notes Payable?",["It is a contra account to Notes Payable","It is subtracted from Notes Payable on the balance sheet","It becomes interest expense over the note's term"],["It is a revenue account","It is reported as a current asset","It increases the carrying amount of Notes Payable"],"It's the interest taken up front, written off to Interest Expense over the note's life.");
lq("L9","notes","Landscape signs a $100,000, 6%, 4-month note on March 1. Which are correct?",["Interest accrued by June 30 is $2,000","At maturity Landscape pays $102,000 in total","The June 30 adjusting entry credits Interest Payable"],["Interest accrued by June 30 is $6,000","The March 1 entry credits Discount on Notes Payable","The June 30 adjusting entry debits Interest Payable"],"$100,000 × 6% × 4/12 = $2,000; face + interest = $102,000.");
lq("L10","notes","Affiliated issues a 6-month, $700,000 noninterest-bearing note with a 12% discount rate. Which are correct?",["Cash received is $658,000","Discount on Notes Payable is debited for $42,000","Notes Payable is credited for $700,000"],["Cash received is $700,000","Discount on Notes Payable is $84,000","Notes Payable is credited for $658,000"],"$700,000 × 12% × 6/12 = $42,000 discount; cash = $658,000.");
lq("L11","loans","Which are true about lines of credit?",["They provide short-term financing the borrower can draw on when needed","They can last several years","A committed line usually requires a commitment fee"],["A noncommitted line requires formal loan paperwork for each draw","They are always secured by inventory","They must be repaid in full within 30 days"],"Noncommitted lines are informal: borrow up to a preset limit without formal procedures.");
lq("L12","loans","Which describe a secured loan?",["The borrower pledges assets as collateral","Pledged assets are usually receivables or inventory","It tends to carry a lower rate than an unsecured loan"],["It's supported only by the borrower's creditworthiness","It's also called a signature loan","The lender has no claim on specific assets if the borrower defaults"],"Unsecured (signature) loans rely only on creditworthiness.");
lq("L13","loans","Which describe commercial paper?",["Unsecured","Maturities of 30 to 270 days","Sold in $25,000 denominations","Interest is usually discounted at issuance"],["Secured by the issuer's inventory","Sold by small businesses to banks","Maturities of 5 to 10 years"],"Commercial paper: unsecured short-term certificates sold by large corporations.");
lq("L14","payroll","Which are accrued liabilities?",["Interest payable","Salaries and wages payable","Income taxes payable"],["Unearned revenue","Prepaid rent","Customer deposits"],"Accrued liabilities are expenses incurred but not yet paid. Unearned revenue is an advance collection.");
lq("L15","payroll","Which are true about FICA?",["It funds Social Security and Medicare","Both the employer and the employee pay it","Social Security applies only up to an annual wage limit"],["Only the employer pays it","Medicare applies only up to an annual wage limit","It funds unemployment insurance"],"Social Security has a wage cap; Medicare applies to all compensation.");
lq("L16","payroll","Which rates are correct?",["Social Security: 6.2% each for employer and employee","Medicare: 1.45% each for employer and employee"],["Social Security: 1.45% each","Medicare: 6.2% each","Social Security is paid only by the employee"],"Both parties pay the same rates: 6.2% (to the limit) and 1.45%.");
lq("L17","payroll","Which conditions must ALL exist to accrue compensated absences?",["The obligation relates to services already rendered","The rights vest or accumulate","Payment is probable","The amount can be reasonably estimated"],["The employee has given notice","The absence must be taken this year","The employee works full-time"],"If the first three are met but the amount can't be estimated, disclose it in the notes.");
lq("L18","payroll","Which sick pay MUST be accrued?",["Sick pay that vests","Accumulated sick days employees can take even when not ill"],["Non-vesting sick pay paid only when illness causes the absence","Sick pay that doesn't accumulate","Sick days that expire unused at year-end"],"Non-vesting sick pay paid only when ill is optional to accrue.");
lq("L19","payroll","Which are usually NOT accrued as liabilities?",["Jury duty leave","Military leave","Holidays that can't be carried forward","Maternity leave"],["Vested vacation pay","Vested sick pay","Vacation days that accumulate and carry forward"],"These don't accumulate if unused, so they usually aren't accrued.");
lq("L20","payroll","Which are true about the rate used for compensated absences?",["GAAP doesn't specify the wage rate to use","Companies generally use the current wage rate","A later raise increases compensation expense when paid"],["GAAP requires the future wage rate","A raise is ignored when the vacation is paid","The accrual is reversed when wages rise"],"The difference between the accrual and the amount paid hits expense in the year paid.");
lq("L21","payroll","Which are true about bonuses?",["They are treated as additional wages","They are recorded as an expense that reduces net income","Year-end bonuses paid next year are accrued to Salaries and Wages Payable"],["They are a distribution of retained earnings","They are recorded only when paid","They're reported as a reduction of revenue"],"Bonuses are expenses, accrued at year-end if paid later.");

  for(const [id,c] of Object.entries(S.time.ch)){const t=L[id]||(L[id]={total:0,modes:{},topics:{}}); t.total+=c.total||0;
    for(const [k,v] of Object.entries(c.modes||{})) t.modes[k]=(t.modes[k]||0)+v; for(const [k,v] of Object.entries(c.topics||{})) t.topics[k]=(t.topics[k]||0)+v;}
  delete S.time.ch; save();}
let lastInput=Date.now(), tickN=0;
["pointerdown","keydown","wheel","touchstart","mousemove"].forEach(ev=>addEventListener(ev,()=>{lastInput=Date.now()},{passive:true}));
const fmtDur=s=>{s=Math.round(s||0); if(s<60) return s+"s"; const m=Math.floor(s/60),h=Math.floor(m/60); return h?`${h}h ${m%60}m`:`${m}m`;};
function curTopic(){try{if(!G)return null;
  if(G.kind==="quick")return G.cur&&G.cur.c.t; if(G.kind==="learn")return G.cur&&G.cur.it.t;
  if(G.kind==="flash")return TBYID(G.deck[G.i]).t; if(G.kind==="frq")return G.f&&G.f.t;}catch(e){} return null}

  c.modes[G.kind]=(c.modes[G.kind]||0)+1;

},1000);

const MODE_NAMES={quick:"Quick-fire",learn:"Learn",flash:"Flashcards",match:"Match",frq:"Free response"};

/* UCLA-style academic quarters (approximate dates) */
const QSPAN={fall:[[8,15],[11,31]],winter:[[0,1],[2,22]],spring:[[2,23],[5,15]],summer:[[5,16],[8,14]]};
function mkQ(season,y){const r=QSPAN[season];return {key:y+"-"+season,season,year:y,name:season[0].toUpperCase()+season.slice(1)+" "+y,start:new Date(y,r[0][0],r[0][1]),end:new Date(y,r[1][0],r[1][1])}}
function quarterFor(d){const y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate();
  return md>=915?mkQ("fall",y):md<=322?mkQ("winter",y):md<=615?mkQ("spring",y):mkQ("summer",y)}
function shiftQ(q,n){for(let i=0;i<Math.abs(n);i++){const d=new Date(n<0?q.start:q.end);d.setDate(d.getDate()+(n<0?-1:1));q=quarterFor(d)}return q}
const parseDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
function quarterAgg(q){const out={total:0,ch:{},days:{}};
  for(const [k,L] of Object.entries(S.time.log)){const d=parseDay(k); if(d<q.start||d>q.end) continue;
    for(const [id,c] of Object.entries(L)){const a=out.ch[id]||(out.ch[id]={total:0,modes:{},topics:{}}); a.total+=c.total; out.total+=c.total;
      out.days[k]=(out.days[k]||0)+c.total;
      for(const [m,v] of Object.entries(c.modes||{})) a.modes[m]=(a.modes[m]||0)+v; for(const [t,v] of Object.entries(c.topics||{})) a.topics[t]=(a.topics[t]||0)+v;}}
  return out}
function allQuarters(){const cur=quarterFor(new Date()); const keys=Object.keys(S.time.log).sort();
  let q=keys.length?quarterFor(parseDay(keys[0])):cur; const list=[]; for(let i=0;i<40;i++){list.push(q); if(q.key===cur.key) break; q=shiftQ(q,1)} return list.reverse()}
function timeHtml(confirmReset,qOff){
  const now=new Date(), curQ=quarterFor(now), q=shiftQ(curQ,qOff), A=quarterAgg(q), isCur=qOff===0;
  const today=S.time.days[dayKey()]||0;
  // weekly bars across the quarter
  const nWeeks=Math.ceil(((q.end-q.start)/864e5+1)/7);
  const weeks=Array.from({length:nWeeks},(_,w)=>{const s=new Date(q.start);s.setDate(s.getDate()+w*7);const e=new Date(s);e.setDate(e.getDate()+6);
    let v=0; for(const [k,x] of Object.entries(A.days)){const d=parseDay(k); if(d>=s&&d<=e) v+=x} return {w:w+1,s,e,v,now:isCur&&now>=s&&now<=new Date(e.getTime()+864e5-1)}});
  const maxW=Math.max(60,...weeks.map(w=>w.v));
  const bar=(v,max)=>`<span class="tbar"><i style="width:${max?Math.max(v?3:0,v/max*100):0}%"></i></span>`;
  const chRows=CHAPTERS.map(ch=>{const c=A.ch[ch.id]||{total:0,modes:{},topics:{}};
    const modes=Object.keys(MODE_NAMES).map(k=>[k,c.modes[k]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    const tops=ch.topics.map(t=>[t.name,c.topics[t.id]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    const mMax=Math.max(1,...modes.map(x=>x[1])), tMax=Math.max(1,...tops.map(x=>x[1]));
    return `<div class="tch"><div class="tch-h"><span><b>Ch. ${ch.num}</b> ${esc(ch.title)}</span><b class="mono">${fmtDur(c.total)}</b></div>
      ${c.total?`<div class="tsub"><span class="eyebrow">By mode</span>${modes.map(([k,v])=>`<div class="trow"><span>${MODE_NAMES[k]}</span>${bar(v,mMax)}<span class="mono">${fmtDur(v)}</span></div>`).join("")}</div>
      ${tops.length?`<div class="tsub"><span class="eyebrow">By topic</span>${tops.map(([n,v])=>`<div class="trow"><span>${esc(n)}</span>${bar(v,tMax)}<span class="mono">${fmtDur(v)}</span></div>`).join("")}</div>`:""}`
      :`<p class="note">No study time in ${q.name}.</p>`}</div>`}).join("");
  const qs=allQuarters(); const qTot=x=>quarterAgg(x).total; const qMax=Math.max(1,...qs.map(qTot));
  return `<div class="set">
    <div class="qnav"><button class="x" id="qprev" aria-label="Previous quarter">‹</button>
      <div class="qname"><b>${q.name}</b><span>${fmtD(q.start)} – ${fmtD(q.end)}${isCur?" · current":""}</span></div>
      <button class="x" id="qnext" aria-label="Next quarter" ${isCur?"disabled":""}>›</button></div>
    <div class="tstats"><div><b>${fmtDur(A.total)}</b><span>This quarter</span></div><div><b>${fmtDur(today)}</b><span>Today</span></div><div><b>${fmtDur(S.time.total)}</b><span>All time</span></div></div>
    <div class="tweek" style="grid-template-columns:repeat(${nWeeks},minmax(0,1fr))" role="img" aria-label="Study time by week in ${q.name}">${weeks.map(w=>`<div class="tday${w.now?" today":""}" title="Week ${w.w} (${fmtD(w.s)}–${fmtD(w.e)}): ${fmtDur(w.v)}"><span class="tcol"><i style="height:${w.v/maxW*100}%"></i></span><span class="tlbl">${w.w}</span></div>`).join("")}</div>
    <p class="note" style="margin-top:-4px">Weeks of the quarter. ${weeks.some(w=>w.v)?`Busiest: week ${weeks.reduce((a,b)=>b.v>a.v?b:a).w} (${fmtDur(Math.max(...weeks.map(w=>w.v)))}).`:"No study time yet this quarter."}</p>
  </div>
  <div class="set"><h3>By chapter · ${q.name}</h3>${chRows}</div>
  <div class="set"><h3>All quarters</h3>${qs.map((x,i)=>{const t=qTot(x);return `<button class="trow tq${x.key===q.key?" sel":""}" data-qkey="${x.key}"><span>${x.name}</span>${bar(t,qMax)}<span class="mono">${fmtDur(t)}</span></button>`}).join("")}</div>
  <p class="note">Time counts only while a question, card or match board is on screen and you've been active in the last 2 minutes. Quarter dates are approximate UCLA dates. Saved in this browser.</p>
  <p class="note">${confirmReset?`Erase all study time? <button class="linkish" id="treset-yes">Yes, reset</button> · <button class="linkish" id="treset-no">Cancel</button>`:`<button class="linkish" id="treset">Reset study time</button>`}</p>`;
}

function openSettings(){
  if($("#settings")) return;

  if(inCard) stopTimer();
  const el=document.createElement("div"); el.className="scrim"; el.id="settings";
  let tab="prefs", confirmReset=false, qOff=0;

      <div class="chips" role="group" aria-label="Seconds per card">${TIMERS.map(t=>`<button class="chip" data-timer="${t}" aria-pressed="${st.timer===t}">${t?t+"s":"Off"}</button>`).join("")}</div>
      <p class="note">${st.timer?`You get ${st.timer} seconds per card for a speed bonus. Answer faster for a bigger bonus. If time runs out you just lose the bonus, and you can keep working on the question.`:"No clock and no speed bonus. Take as long as you need."}</p></div>`}
    <button class="btn primary" id="set-done">Done</button></div>`;
    el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;confirmReset=false;draw();const t=el.querySelector(`[data-tab="${tab}"]`);if(t)t.focus()});
    const qp=el.querySelector("#qprev"); if(qp) qp.onclick=()=>{qOff--;draw();el.querySelector("#qprev").focus()};
    const qn=el.querySelector("#qnext"); if(qn) qn.onclick=()=>{if(qOff<0){qOff++;draw();const b=el.querySelector(qOff<0?"#qnext":"#qprev"); if(b) b.focus()}};
    el.querySelectorAll("[data-qkey]").forEach(b=>b.onclick=()=>{const cur=quarterFor(new Date()); let o=0,q=cur; while(q.key!==b.dataset.qkey&&o>-40){o--;q=shiftQ(cur,o)} qOff=o; draw()});
    const rs=el.querySelector("#treset"); if(rs) rs.onclick=()=>{confirmReset=true;draw()};
    const ry=el.querySelector("#treset-yes"); if(ry) ry.onclick=()=>{S.time={total:0,days:{},log:{}};save();confirmReset=false;qOff=0;draw()};
    const rn=el.querySelector("#treset-no"); if(rn) rn.onclick=()=>{confirmReset=false;draw()};
    el.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.themeSet;save();applyTheme();draw()});
    el.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>{S.settings.timer=+b.dataset.timer;save();draw()});
    el.querySelector("#set-x").onclick=close; el.querySelector("#set-done").onclick=close; };
  const close=()=>{el.remove(); document.removeEventListener("keydown",esc1,true);
    if(inCard&&G&&!G.locked){ if(S.settings.timer!==t0) G.t0=performance.now(); else G.t0+=performance.now()-pausedAt; setupClock(); runTimer(); }
    const g=$("#gear"); if(g) g.focus(); };
  const esc1=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  el.addEventListener("click",e=>{if(e.target===el)close()});
  document.addEventListener("keydown",esc1,true);
  draw(); document.body.appendChild(el); $("#set-done").focus();
}

/* ================= flashcards ================= */
const TBYID=id=>CH.terms.find(t=>t.id===id);
function startFlash(onlyLearning,n){
  const r=R(CH); let pool=CH.terms.filter(t=>r.topics.includes(t.t));
  if(onlyLearning) pool=pool.filter(t=>r.flash[t.id]===false);
  // still-learning and unseen first, then known
  const rank=t=>r.flash[t.id]===false?0:r.flash[t.id]===undefined?1:2;
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  if(n&&n!=="All") pool=pool.slice(0,n);
  if(!pool.length) return;
  G={kind:"flash",deck:shuffle(pool.map(t=>t.id)),i:0,flipped:false,res:{}};
  renderFlash();
}
function renderFlash(){
  const r=R(CH); const t=TBYID(G.deck[G.i]); const defFirst=r.flFront==="def"; G.flipped=false;
  const vals=Object.values(G.res); const k=vals.filter(Boolean).length, l=vals.length-k;
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Flashcards`);
  const face=(isTerm)=>isTerm?`<span class="eyebrow">Term</span><p class="fc-term">${esc(t.term)}</p>`:`<span class="eyebrow">Definition</span><p class="fc-def">${esc(t.def)}</p>`;
  go(`<div class="quiz">
    <div class="qtop"><button class="x" id="quit" aria-label="Exit flashcards">${ICON.close}</button>
      <div class="track"><i style="width:${G.i/G.deck.length*100}%"></i></div><span class="qcount" style="margin:0">${G.i+1} / ${G.deck.length}</span></div>
    <div class="fc-tally"><span class="tl learn"><b>${l}</b> Still learning</span><span class="eyebrow">${esc(topicName(t.t))}</span><span class="tl know"><b>${k}</b> Know it</span></div>
    <button class="flashcard enter" id="fc" aria-label="Flip card" aria-pressed="false">
      <span class="fc-inner"><span class="fc-face front">${face(!defFirst)}<span class="fc-hint">Click or press Space to flip</span></span>
      <span class="fc-face back">${face(defFirst)}</span></span>
    </button>
    <div class="fc-actions">
      <button class="btn big fc-learn" id="learn">${CROSS}<span>Still learning</span></button>
      <button class="btn big fc-know" id="know">${CHECK}<span>Know it</span></button>
    </div>
    <div class="row fc-opts">
      <button class="btn quiet" id="prev" ${G.i?"":"disabled"}>← Previous</button>
      <button class="btn quiet" id="swap">${defFirst?"Show terms first":"Show definitions first"}</button>
    </div>
  </div>`);
  $("#quit").onclick=()=>setup(CH);
  $("#fc").onclick=flipFlash;
  $("#know").onclick=()=>markFlash(true); $("#learn").onclick=()=>markFlash(false);
  $("#prev").onclick=()=>{if(G.i){G.i--;renderFlash()}};
  $("#swap").onclick=()=>{r.flFront=defFirst?"term":"def";save();renderFlash()};
}
function flipFlash(){const f=$("#fc"); if(!f) return; G.flipped=!G.flipped; f.classList.toggle("flipped",G.flipped); f.setAttribute("aria-pressed",String(G.flipped))}
function markFlash(known){
  const id=G.deck[G.i]; const r=R(CH); r.flash[id]=known; G.res[id]=known; save();
  if(G.i<G.deck.length-1){G.i++;renderFlash()} else finishFlash();
}
function finishFlash(){
  const ids=G.deck, k=ids.filter(id=>G.res[id]).length, learn=ids.filter(id=>G.res[id]===false);
  topbar(`<button id="crumb-ch">Ch. ${CH.num}</button> / Flashcards`);
  const pct=ids.length?k/ids.length:0;
  go(`<div class="narrow" style="display:flex;flex-direction:column;gap:22px">
  <section class="panel panel-pad enter"><div class="result-top">${ring(pct,96)}<div><span class="eyebrow">Deck finished</span>
    <p class="verdict" style="color:${pct>=0.8?"var(--accent)":"var(--gilt)"}">${pct===1?"You know them all":pct>=0.8?"Almost there":"Keep going"}</p></div></div>
    <div class="statgrid"><div><b>${k}</b><span>Know it</span></div><div><b>${learn.length}</b><span>Still learning</span></div><div><b>${ids.length}</b><span>Cards</span></div></div></section>
  ${learn.length?`<section class="panel panel-pad enter"><h2>Still learning</h2><div class="misses">${learn.map(id=>{const t=TBYID(id);return `<div class="miss"><p class="ans" style="margin:0">${esc(t.term)}</p><p class="why">${esc(t.def)}</p></div>`}).join("")}</div></section>`:""}
  <div class="row">${learn.length?`<button class="btn primary big" id="again">Review ${learn.length} still learning</button>`:""}<button class="btn ${learn.length?"":"primary big"}" id="restart">Restart deck</button><button class="btn quiet" id="back">Change settings</button></div></div>`);
  const a=$("#again"); if(a) a.onclick=()=>{G={kind:"flash",deck:shuffle(learn),i:0,flipped:false,res:{}};renderFlash()};
  $("#restart").onclick=()=>{G={kind:"flash",deck:shuffle(ids),i:0,flipped:false,res:{}};renderFlash()};
